<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PR Portfolio</title><meta name="description" content="Profile, Game, Portfolio"><link rel="stylesheet" href="canvas.css?v=20261111b"></head>
<body><div class="canvas"><header><div class="brand"><h1 id="siteTitle"></h1><p id="siteSubtitle"></p></div><nav id="pageNav" aria-label="페이지 선택" role="tablist"></nav><span class="corner-mark" aria-hidden="true">◇</span></header><aside class="rail"><span class="rail-line" aria-hidden="true"></span><div id="itemNav" role="tablist" aria-label="항목 선택"></div><span class="rail-end" aria-hidden="true">✦</span></aside><main id="stage" tabindex="-1"></main><div class="canvas-bottom"><span id="counter"></span><button id="openEditor">전체 편집 <span aria-hidden="true">↗</span></button></div></div>
<dialog id="editor"><form id="editorForm"><div class="editor-head"><div><span class="eyebrow">CONTENT STUDIO</span><h2>전체 콘텐츠 편집</h2></div><button type="button" id="closeEditor" aria-label="편집 취소하고 닫기">×</button></div><div class="editor-actions"><button type="button" id="saveDraft" class="primary">전체 저장</button><button type="button" id="exportContent">수정본 내보내기</button><label class="file-button">수정본 불러오기<input type="file" id="importContent" accept="application/json,.json"></label><span id="editStatus" role="status"></span></div><p class="editor-guide">모든 글과 이미지를 이 화면에서 수정합니다. 글은 표에 입력하고, 이미지는 여러 장을 한 번에 선택하세요.</p><details class="global-settings" open><summary>제목 · 메뉴 이름</summary><div id="globalFields"></div></details><section class="bulk-tools"><div><label for="bulkPage">일괄 입력할 페이지</label><select id="bulkPage"></select></div><label class="file-button accent">이미지 여러 장 넣기<input type="file" multiple id="bulkImages" accept="image/png,image/jpeg,image/webp,image/gif"></label><button type="button" id="showTextPaste">글 여러 개 붙여넣기</button><span>선택한 페이지의 첫 번째 항목부터 순서대로 배치합니다.</span></section><section id="textPastePanel" hidden><label for="textPaste">첫 줄은 제목, 다음 줄부터는 설명입니다. 항목 사이는 한 줄에 --- 를 넣어 구분하세요.</label><textarea id="textPaste" rows="6" placeholder="첫 번째 제목&#10;첫 번째 설명&#10;---&#10;두 번째 제목&#10;두 번째 설명"></textarea><button type="button" id="applyTextPaste">선택한 페이지에 적용</button></section><div id="editorRows"></div><div class="editor-foot"><p>전체 저장은 이 브라우저에 보관합니다. 공개 사이트에 반영하려면 수정본을 내보내 이 채팅에 첨부해 주세요.</p><button type="button" id="saveAndClose" class="primary">전체 저장하고 닫기</button></div></form></dialog><div id="toast" role="status"></div><script src="canvas.js?v=20261111b"></script></body></html>
