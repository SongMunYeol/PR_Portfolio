name: Deploy PR to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: next-source/pnpm-lock.yaml
      - name: Install Next.js dependencies
        working-directory: next-source
        run: pnpm install --frozen-lockfile
      - name: Build published content
        working-directory: next-source
        run: node scripts/build-static.cjs content.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: next-source/.static-build/out
      - name: Wait for deployment artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = `github-pages-${process.env.GITHUB_RUN_ATTEMPT}`;
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId
              });
              if (data.artifacts.some(artifact => artifact.name === artifactName)) return;
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error('Deployment artifact was not available after waiting.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
